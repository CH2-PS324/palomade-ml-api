steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/sawit-palomade:$COMMIT_SHA', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', 'gcr.io/$PROJECT_ID/sawit-palomade:$COMMIT_SHA']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - 'api-model-sawit'
      - '--image=gcr.io/$PROJECT_ID/sawit-palomade:$COMMIT_SHA'
      - '--region=us-central1'
      - '--cpu=2'
      - '--memory=2048Mi'
      - '--allow-unauthenticated'
images:
  - 'gcr.io/$PROJECT_ID/sawit-palomade:$COMMIT_SHA'
logsBucket: 'gs://palomade-storage/logs'
